<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="main-area">
        <header class="page-header">
            <h1>Dashboard</h1>
            <p>Ringkasan inventori Anda</p>
        </header>
        <div class="stat-grid">
            <div class="stat-card">
                <div class="label">Total produk</div>
                <div class="value" th:text="${#numbers.formatDecimal(totalProducts, 0, 'POINT', 0, 'COMMA')}">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Aktif</div>
                <div class="value" th:text="${#numbers.formatDecimal(activeProducts, 0, 'POINT', 0, 'COMMA')}">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Nonaktif</div>
                <div class="value" th:text="${#numbers.formatDecimal(inactiveProducts, 0, 'POINT', 0, 'COMMA')}">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total stok (unit)</div>
                <div class="value" th:text="${#numbers.formatDecimal(totalStock != null ? totalStock : 0, 0, 'POINT', 0, 'COMMA')}">0</div>
            </div>
            <div class="stat-card" style="grid-column: span 2;">
                <div class="label">Nilai inventori (harga × stok)</div>
                <div class="value" th:text="${'Rp ' + #numbers.formatDecimal(totalValue != null ? totalValue : 0, 0, 'POINT', 0, 'COMMA')}">Rp 0</div>
            </div>
        </div>
        <div class="row-actions">
            <a th:href="@{/products}" class="btn btn-primary">Kelola produk</a>
            <a th:href="@{/categories}" class="btn btn-secondary">Kelola kategori</a>
        </div>
    </div>
</div>
</body>
</html>
