<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-violet-900">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        
        <div class="mb-10 animate-fade-in-up">
            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-3 font-['Space_Grotesk']">Dashboard</h1>
            <p class="text-gray-400 text-lg">Ringkasan statistik produk Anda</p>
        </div>

        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            
            <div class="bg-white/10 backdrop-blur-lg rounded-3xl shadow-xl border border-white/20 p-7 group hover:bg-white/20 transition-all duration-300 card-3d">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-400 font-semibold uppercase tracking-wide mb-2">Total Produk</p>
                        <p class="text-4xl font-extrabold text-white" th:text="${totalProducts}">0</p>
                    </div>
                    <div class="w-14 h-14 bg-gradient-to-br from-primary-500 to-primary-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                        <i class="fas fa-box text-2xl text-white"></i>
                    </div>
                </div>
            </div>

            
            <div class="bg-white/10 backdrop-blur-lg rounded-3xl shadow-xl border border-white/20 p-7 group hover:bg-white/20 transition-all duration-300 card-3d" style="animation-delay: 100ms;">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-400 font-semibold uppercase tracking-wide mb-2">Produk Aktif</p>
                        <p class="text-4xl font-extrabold text-green-400" th:text="${activeProducts}">0</p>
                    </div>
                    <div class="w-14 h-14 bg-gradient-to-br from-green-500 to-emerald-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                        <i class="fas fa-check-circle text-2xl text-white"></i>
                    </div>
                </div>
            </div>

            
            <div class="bg-white/10 backdrop-blur-lg rounded-3xl shadow-xl border border-white/20 p-7 group hover:bg-white/20 transition-all duration-300 card-3d" style="animation-delay: 200ms;">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-400 font-semibold uppercase tracking-wide mb-2">Produk Tidak Aktif</p>
                        <p class="text-4xl font-extrabold text-red-400" th:text="${inactiveProducts}">0</p>
                    </div>
                    <div class="w-14 h-14 bg-gradient-to-br from-red-500 to-rose-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                        <i class="fas fa-times-circle text-2xl text-white"></i>
                    </div>
                </div>
            </div>

            
            <div class="bg-white/10 backdrop-blur-lg rounded-3xl shadow-xl border border-white/20 p-7 group hover:bg-white/20 transition-all duration-300 card-3d" style="animation-delay: 300ms;">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-400 font-semibold uppercase tracking-wide mb-2">Total Stok</p>
                        <p class="text-4xl font-extrabold text-purple-400" th:text="${totalStock}">0</p>
                    </div>
                    <div class="w-14 h-14 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                        <i class="fas fa-warehouse text-2xl text-white"></i>
                    </div>
                </div>
            </div>
        </div>

        
        <div class="bg-gradient-to-r from-primary-600 via-primary-700 to-purple-700 rounded-3xl shadow-2xl p-10 mb-10 text-white relative overflow-hidden group animate-fade-in-up" style="animation-delay: 400ms;">
            <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -mr-20 -mt-20 group-hover:scale-150 transition-transform duration-700"></div>
            <div class="absolute bottom-0 left-0 w-48 h-48 bg-white/5 rounded-full blur-3xl -ml-20 -mb-20 group-hover:scale-150 transition-transform duration-700" style="animation-delay: 200ms;"></div>
            <div class="relative z-10 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium uppercase tracking-wider text-primary-100 mb-2">Total Nilai Inventori</p>
                    <p class="text-5xl md:text-6xl font-extrabold mb-3" th:text="'Rp ' + ${#numbers.formatDecimal(totalValue, 0, 'POINT', 0, 'COMMA')}">Rp 0</p>
                    <p class="text-primary-100">Nilai total dari semua produk Anda</p>
                </div>
                <div class="w-20 h-20 bg-white/20 p-6 rounded-3xl backdrop-blur-sm group-hover:scale-110 transition-transform">
                    <i class="fas fa-wallet text-3xl text-white"></i>
                </div>
            </div>
        </div>

        
        <div class="bg-white/10 backdrop-blur-lg rounded-3xl shadow-xl border border-white/20 p-8 animate-fade-in-up" style="animation-delay: 500ms;">
            <h2 class="text-xl font-bold text-white mb-8 font-['Space_Grotesk']">Aksi Cepat</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <a th:href="@{/products/new}" class="group flex items-center justify-center gap-3 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-semibold px-8 py-4 rounded-xl transition-all shadow-lg hover:shadow-2xl transform hover:-translate-y-1 duration-300 relative overflow-hidden">
                    <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <span class="relative flex items-center gap-2">
                        <i class="fas fa-plus text-xl group-hover:rotate-90 transition-transform"></i>
                        Tambah Produk
                    </span>
                </a>
                <a th:href="@{/products}" class="group flex items-center justify-center gap-3 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white font-semibold px-8 py-4 rounded-xl transition-all shadow-lg hover:shadow-2xl transform hover:-translate-y-1 duration-300 relative overflow-hidden">
                    <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <span class="relative flex items-center gap-2">
                        <i class="fas fa-list text-xl"></i>
                        Daftar Produk
                    </span>
                </a>
                <a th:href="@{/swagger-ui.html}" target="_blank" class="group flex items-center justify-center gap-3 bg-white/10 hover:bg-white/20 text-white font-semibold px-8 py-4 rounded-xl border border-white/20 transition-all shadow-lg hover:shadow-2xl transform hover:-translate-y-1 duration-300 relative overflow-hidden">
                    <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <span class="relative flex items-center gap-2">
                        <i class="fas fa-code text-xl text-primary-300"></i>
                        API Docs
                    </span>
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
