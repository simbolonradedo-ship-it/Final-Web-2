<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <!-- Back Button -->
        <div class="mb-6">
            <a href="/" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-medium transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Kembali ke Home
            </a>
        </div>

        <!-- Profile Card -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-purple-600 to-pink-600 px-8 py-6">
                <h2 class="text-2xl font-bold text-white" th:text="${user.fullName != null ? user.fullName : user.username}">User Name</h2>
                <p class="text-purple-100 mt-1">Profil pengguna</p>
            </div>

            <!-- Content -->
            <div class="p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Username</dt>
                            <dd class="mt-1 text-lg text-gray-900" th:text="${user.username}">-</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Email</dt>
                            <dd class="mt-1 text-gray-900" th:text="${user.email != null ? user.email : '-'}">-</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Nomor Telepon</dt>
                            <dd class="mt-1 text-gray-900" th:text="${user.phoneNumber != null ? user.phoneNumber : '-'}">-</dd>
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Alamat</dt>
                            <dd class="mt-1 text-gray-900 whitespace-pre-wrap" th:text="${user.address != null ? user.address : '-'}">-</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Bio</dt>
                            <dd class="mt-1 text-gray-900 whitespace-pre-wrap" th:text="${user.bio != null ? user.bio : '-'}">-</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Tanggal Daftar</dt>
                            <dd class="mt-1 text-gray-900" th:text="${#temporals.format(user.createdAt, 'dd MMMM yyyy HH:mm')}">-</dd>
                        </div>
                    </div>
                </div>

                <!-- Profile Image Section -->
                <div class="mt-8 pt-6 border-t border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Foto Profil</h3>
                    <div th:if="${user.profileImageUrl != null && !user.profileImageUrl.isEmpty()}">
                        <img th:src="${user.profileImageUrl}" alt="Profile Image" class="w-32 h-32 rounded-full object-cover border-4 border-purple-200 shadow-lg">
                    </div>
                    <div th:if="${user.profileImageUrl == null || user.profileImageUrl.isEmpty()}">
                        <div class="w-32 h-32 rounded-full bg-gradient-to-r from-purple-400 to-pink-400 flex items-center justify-center text-white text-4xl font-bold shadow-lg">
                            <span th:text="${user.fullName != null ? user.fullName.substring(0,1).toUpperCase() : user.username.substring(0,1).toUpperCase()}">U</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="bg-gray-50 px-8 py-6 border-t border-gray-200">
                <div class="flex flex-wrap gap-3">
                    <a href="/profile/edit" class="inline-flex items-center px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl transition-all shadow-sm hover:shadow-md">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        Edit Profil
                    </a>
                    <a href="/" class="inline-flex items-center px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-xl transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                        Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
