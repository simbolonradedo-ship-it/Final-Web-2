<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-10 max-w-3xl">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Profil</h1>
                <p class="text-gray-600 mt-1" th:text="${user.username}">username</p>
            </div>
            <div class="flex flex-wrap gap-3 justify-end">
                <a th:href="@{/profile/password}" class="inline-flex justify-center items-center px-5 py-2.5 rounded-xl border border-gray-300 bg-white text-gray-800 font-medium hover:bg-gray-50 transition-colors">
                    Ganti password
                </a>
                <a th:href="@{/profile/edit}" class="inline-flex justify-center items-center px-5 py-2.5 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700 transition-colors">
                    Edit profil
                </a>
            </div>
        </div>

        <div th:if="${successMessage}" class="mb-6 p-4 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-800 rounded-r-lg" role="alert" th:text="${successMessage}">
        </div>
        <div th:if="${errorMessage}" class="mb-6 p-4 bg-rose-50 border-l-4 border-rose-500 text-rose-800 rounded-r-lg" role="alert" th:text="${errorMessage}">
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-8 flex flex-col sm:flex-row gap-8">
                <div class="flex-shrink-0 mx-auto sm:mx-0">
                    <div th:if="${user.profileImageUrl != null}" class="w-36 h-36 rounded-2xl overflow-hidden border border-gray-200 shadow-sm">
                        <img th:src="${user.profileImageUrl}" alt="Foto profil" class="w-full h-full object-cover">
                    </div>
                    <div th:unless="${user.profileImageUrl != null}" class="w-36 h-36 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-4xl font-bold border border-gray-200 shadow-sm"
                         th:text="${user.fullName != null && !user.fullName.isEmpty()} ? ${#strings.substring(user.fullName,0,1).toUpperCase()} : ${#strings.substring(user.username,0,1).toUpperCase()}">
                        ?
                    </div>
                </div>
                <dl class="flex-1 space-y-4 text-sm">
                    <div>
                        <dt class="text-gray-500 font-medium">Nama lengkap</dt>
                        <dd class="text-gray-900 mt-1" th:text="${user.fullName != null && !user.fullName.isEmpty()} ? ${user.fullName} : '—'">—</dd>
                    </div>
                    <div>
                        <dt class="text-gray-500 font-medium">Email</dt>
                        <dd class="text-gray-900 mt-1" th:text="${user.email != null && !user.email.isEmpty()} ? ${user.email} : '—'">—</dd>
                    </div>
                    <div>
                        <dt class="text-gray-500 font-medium">Nomor telepon</dt>
                        <dd class="text-gray-900 mt-1" th:text="${user.phoneNumber != null && !user.phoneNumber.isEmpty()} ? ${user.phoneNumber} : '—'">—</dd>
                    </div>
                    <div>
                        <dt class="text-gray-500 font-medium">Alamat</dt>
                        <dd class="text-gray-900 mt-1 whitespace-pre-wrap" th:text="${user.address != null && !user.address.isEmpty()} ? ${user.address} : '—'">—</dd>
                    </div>
                    <div>
                        <dt class="text-gray-500 font-medium">Bio</dt>
                        <dd class="text-gray-900 mt-1 whitespace-pre-wrap" th:text="${user.bio != null && !user.bio.isEmpty()} ? ${user.bio} : '—'">—</dd>
                    </div>
                </dl>
            </div>
        </div>

        <p class="mt-6 text-center text-sm text-gray-500" th:if="${user.updatedAt != null}">
            Terakhir diperbarui: <span th:text="${#temporals.format(user.updatedAt, 'dd MMM yyyy, HH:mm')}">—</span>
        </p>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
