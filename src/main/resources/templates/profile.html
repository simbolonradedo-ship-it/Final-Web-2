<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gradient-to-br from-slate-50 via-purple-50 to-pink-50">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-12 max-w-4xl">
        
        <div class="mb-6 animate-fade-in">
            <a href="/" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-semibold transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Kembali ke Dashboard
            </a>
        </div>

        
        <div class="bg-white/90 backdrop-blur-lg rounded-2xl shadow-2xl overflow-hidden border border-white/20 animate-slide-up">
            
            <div class="bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 px-8 py-8 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -mr-32 -mt-32"></div>
                <div class="relative z-10">
                    <h2 class="text-3xl font-bold text-white mb-1" th:text="${user.fullName != null ? user.fullName : user.username}">User Name</h2>
                    <p class="text-purple-100 text-sm">Profil pengguna</p>
                </div>
            </div>

            
            <div class="p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div class="border-b border-gray-200 pb-4 group">
                            <dt class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Username</dt>
                            <dd class="text-lg text-gray-900 font-semibold" th:text="${user.username}">-</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4 group">
                            <dt class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Email</dt>
                            <dd class="text-lg text-gray-900" th:text="${user.email != null ? user.email : '-'}">-</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4 group">
                            <dt class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Nomor Telepon</dt>
                            <dd class="text-lg text-gray-900" th:text="${user.phoneNumber != null ? user.phoneNumber : '-'}">-</dd>
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div class="border-b border-gray-200 pb-4 group">
                            <dt class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Alamat</dt>
                            <dd class="text-lg text-gray-900 whitespace-pre-wrap" th:text="${user.address != null ? user.address : '-'}">-</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4 group">
                            <dt class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Bio</dt>
                            <dd class="text-lg text-gray-900 whitespace-pre-wrap" th:text="${user.bio != null ? user.bio : '-'}">-</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4 group">
                            <dt class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Tanggal Daftar</dt>
                            <dd class="text-lg text-gray-900" th:text="${#temporals.format(user.createdAt, 'dd MMMM yyyy HH:mm')}">-</dd>
                        </div>
                    </div>
                </div>

                
                <div class="mt-8 pt-6 border-t border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Foto Profil</h3>
                    <div th:if="${user.profileImageUrl != null && !user.profileImageUrl.isEmpty()}">
                        <img th:src="${user.profileImageUrl}" alt="Profile Image" class="w-32 h-32 rounded-full object-cover border-4 border-purple-200 shadow-xl hover:shadow-2xl transition-shadow">
                    </div>
                    <div th:if="${user.profileImageUrl == null || user.profileImageUrl.isEmpty()}">
                        <div class="w-32 h-32 rounded-full bg-gradient-to-r from-purple-400 via-pink-400 to-blue-400 flex items-center justify-center text-white text-4xl font-bold shadow-xl">
                            <span th:text="${user.fullName != null ? user.fullName.substring(0,1).toUpperCase() : user.username.substring(0,1).toUpperCase()}">U</span>
                        </div>
                    </div>
                </div>
            </div>

            
            <div class="bg-gray-50 px-8 py-6 border-t border-gray-200">
                <div class="flex flex-wrap gap-3">
                    <a th:href="@{/profile/edit}" class="btn btn-primary btn-lg">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        Edit Profil
                    </a>
                    <a th:href="@{/profile/change-password}" class="btn btn-secondary btn-lg">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L12 17h-1.602A3.602 3.602 0 0110 16.602V16H8v-.398A3.602 3.602 0 015.398 13H4a1 1 0 01-1-1V8a1 1 0 011-1h1.398A3.602 3.602 0 0110 6.398V6h2.602A3.602 3.602 0 0114 8.398V7h1a1 1 0 011 1v9a1 1 0 01-1 1h-1.602a3.602 3.602 0 01-1.601-1.602V16a6 6 0 006-6z"/>
                        </svg>
                        Ubah Password
                    </a>
                    <a href="/" class="btn btn-outline btn-lg">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                        Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
