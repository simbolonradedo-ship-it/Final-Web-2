<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <!-- Back Button -->
        <div class="mb-6">
            <a th:href="@{/products}" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-medium transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Kembali ke Daftar
            </a>
        </div>

        <!-- Product Card -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-800 px-8 py-6">
                <h2 class="text-2xl font-bold text-white" th:text="${product.name}">Nama Produk</h2>
                <p class="text-blue-100 mt-1">Detail informasi produk</p>
            </div>

            <!-- Content -->
            <div class="p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Nama</dt>
                            <dd class="mt-1 text-lg text-gray-900" th:text="${product.name}">-</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Harga</dt>
                            <dd class="mt-1 text-2xl font-bold text-green-600" th:text="${'Rp ' + #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')}">Rp 0</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Stok</dt>
                            <dd class="mt-1">
                                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium" th:class="${product.stock > 0} ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'" th:text="${product.stock}">0</span>
                            </dd>
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Deskripsi</dt>
                            <dd class="mt-1 text-gray-700 whitespace-pre-wrap" th:text="${product.description != null ? product.description : '-'}">-</dd>
                        </div>
                        <div class="border-b border-gray-200 pb-4">
                            <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">ID Produk</dt>
                            <dd class="mt-1 text-gray-900 font-mono text-sm" th:text="${product.id}">-</dd>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="bg-gray-50 px-8 py-6 border-t border-gray-200">
                <div class="flex flex-wrap gap-3">
                    <a th:href="@{/products/{id}/edit(id=${product.id})}" class="inline-flex items-center px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded-xl transition-all shadow-sm hover:shadow-md">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        Edit Produk
                    </a>
                    <a th:href="@{/products}" class="inline-flex items-center px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-xl transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                        </svg>
                        Lihat Semua Produk
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
