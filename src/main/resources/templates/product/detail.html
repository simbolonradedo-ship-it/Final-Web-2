<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="main-area">
        <a th:href="@{/products}" class="back-link">← Daftar produk</a>
        <div class="form-card">
            <div class="form-card-header">
                <h1 th:text="${product.name}">Produk</h1>
                <p style="margin:0.35rem 0 0;color:var(--text-muted);font-size:0.9rem;" th:text="${product.category?.name}">Kategori</p>
            </div>
            <div class="form-card-body">
                <div class="stat-grid" style="margin-bottom:1rem;">
                    <div class="stat-card">
                        <div class="label">Harga</div>
                        <div class="value" style="font-size:1.35rem;" th:text="${'Rp ' + #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')}">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Stok</div>
                        <div class="value" style="font-size:1.35rem;" th:text="${product.stock}">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Status</div>
                        <div class="value" style="font-size:1rem;">
                            <span class="pill" th:classappend="${product.active} ? ' pill-green' : ' pill-red'"
                                  th:text="${product.active} ? 'Aktif' : 'Nonaktif'">—</span>
                        </div>
                    </div>
                </div>
                <div th:if="${product.description}">
                    <div class="form-label">Deskripsi</div>
                    <p style="color:var(--text-muted);" th:text="${product.description}"></p>
                </div>
                <div class="dl-grid" style="margin-top:1rem;font-size:0.85rem;color:var(--text-muted);">
                    <p th:if="${product.createdAt}">Dibuat: <span th:text="${product.createdAt}"></span></p>
                    <p th:if="${product.createdBy}">Oleh: <span th:text="${product.createdBy}"></span></p>
                </div>
                <div class="row-actions" style="margin-top:1.25rem;">
                    <a th:href="@{/products/{id}/edit(id=${product.id})}" class="btn btn-primary">Edit</a>
                    <a th:href="@{/products}" class="btn btn-secondary">Tutup</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
