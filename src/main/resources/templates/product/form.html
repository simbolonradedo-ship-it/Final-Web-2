<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="main-area">
        <a th:href="@{/products}" class="back-link">← Kembali</a>
        <div class="form-card">
            <div class="form-card-header">
                <h1 th:text="${product.id != null} ? 'Edit produk' : 'Produk baru'">Form</h1>
            </div>
            <div class="form-card-body">
                <div th:if="${errorMessage}" class="flash flash-error" th:text="${errorMessage}"></div>
                <form th:action="@{/products/save}" th:object="${product}" method="post" class="form-grid">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div>
                        <label class="form-label" for="name">Nama</label>
                        <input class="input" style="max-width:none;width:100%;" id="name" th:field="*{name}" required placeholder="Nama produk">
                    </div>

                    <div>
                        <label class="form-label" for="category">Kategori</label>
                        <select class="input" style="max-width:none;width:100%;" id="category" th:field="*{category.id}" required>
                            <option value="">Pilih…</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                        </select>
                    </div>

                    <div class="form-grid form-grid-2">
                        <div>
                            <label class="form-label" for="priceDisplay">Harga (Rp)</label>
                            <input class="input" style="max-width:none;width:100%;" type="text" id="priceDisplay" required placeholder="0">
                            <input type="hidden" th:field="*{price}" id="price">
                        </div>
                        <div>
                            <label class="form-label" for="stock">Stok</label>
                            <input class="input" style="max-width:none;width:100%;" type="number" id="stock" th:field="*{stock}" required min="0">
                        </div>
                    </div>

                    <div>
                        <label class="form-label" for="description">Deskripsi</label>
                        <textarea class="input" style="max-width:none;width:100%;min-height:100px;" id="description" th:field="*{description}" rows="4"></textarea>
                    </div>

                    <div class="card" style="margin:0;display:flex;align-items:center;gap:0.75rem;">
                        <input type="checkbox" id="active" th:field="*{active}">
                        <label for="active" style="margin:0;">Produk aktif</label>
                    </div>

                    <div class="row-actions" style="margin:0;">
                        <button type="submit" class="btn btn-primary">Simpan</button>
                        <a th:href="@{/products}" class="btn btn-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    const priceHidden = document.getElementById('price');
    const priceDisplay = document.getElementById('priceDisplay');
    function formatThousand(value) { return Number(value).toLocaleString('id-ID'); }
    if (priceHidden.value && priceHidden.value !== '0') {
        priceDisplay.value = formatThousand(priceHidden.value);
    }
    priceDisplay.addEventListener('input', function () {
        const raw = this.value.replace(/\./g, '').replace(/\D/g, '');
        priceHidden.value = raw;
        this.value = raw ? formatThousand(raw) : '';
    });
</script>
</body>
</html>
