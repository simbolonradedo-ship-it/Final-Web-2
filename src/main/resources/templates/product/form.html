<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-12 max-w-3xl">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-800" th:text="${product.id != null} ? 'Edit Produk' : 'Tambah Produk Baru'">Form Produk</h2>
            <p class="text-gray-500 mt-2" th:text="${product.id != null} ? 'Perbarui informasi produk di bawah ini' : 'Isi form berikut untuk menambahkan produk baru'"></p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-8">
            <form th:action="${product.id != null ? @{/products/{id}(id=${product.id})} : @{/products}}" th:object="${product}" method="post" class="space-y-6">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="_method" th:value="${product.id != null ? 'PUT' : 'POST'}" th:if="${product.id != null}"/>

                <div>
                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Nama Produk</label>
                    <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all" id="name" th:field="*{name}" placeholder="Masukkan nama produk" required>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label for="price" class="block text-sm font-semibold text-gray-700 mb-2">Harga (Rp)</label>
                        <input type="number" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all" id="price" th:field="*{price}" placeholder="0" required>
                    </div>
                    <div>
                        <label for="stock" class="block text-sm font-semibold text-gray-700 mb-2">Stok</label>
                        <input type="number" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all" id="stock" th:field="*{stock}" min="0" placeholder="0" required>
                    </div>
                </div>

                <div>
                    <label for="description" class="block text-sm font-semibold text-gray-700 mb-2">Deskripsi (Opsional)</label>
                    <textarea class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all resize-none" id="description" th:field="*{description}" rows="4" placeholder="Masukkan deskripsi produk"></textarea>
                </div>

                <div class="flex justify-end gap-4 pt-4">
                    <a th:href="@{/products}" class="inline-flex items-center px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-xl transition-all">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                        Batal
                    </a>
                    <button type="submit" class="inline-flex items-center px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Simpan Produk
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
