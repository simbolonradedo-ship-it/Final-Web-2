<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="main-area">
        <header class="page-header">
            <h1 th:text="${pageTitle}">Produk</h1>
            <p th:if="${isMyProductView}">Kelola inventori Anda</p>
            <p th:if="${isCatalogView}">Katalog dari akun admin</p>
        </header>

        <div class="row-actions" th:if="${isMyProductView or isCatalogView}">
            <a th:if="${isMyProductView}" th:href="@{/products/new}" class="btn btn-primary">+ Produk baru</a>
            <a th:if="${isMyProductView}" th:href="@{/products(catalog=true)}" class="btn btn-secondary">Lihat katalog</a>
            <a th:if="${isCatalogView}" th:href="@{/products}" class="btn btn-secondary">← Produk saya</a>
        </div>

        <div th:if="${successMessage}" class="flash flash-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="flash flash-error" th:text="${errorMessage}"></div>

        <div class="card">
            <form th:action="@{/products}" method="get" class="filter-form">
                <input type="hidden" name="catalog" th:value="${isCatalogView}">
                <div>
                    <label class="form-label">Cari</label>
                    <input class="input" type="text" name="keyword" th:value="${keyword}" placeholder="Nama produk…">
                </div>
                <div>
                    <label class="form-label">Kategori</label>
                    <select class="input" name="categoryId">
                        <option value="">Semua</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                th:selected="${selectedCategory != null && selectedCategory.id == cat.id}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Terapkan</button>
                <a th:href="@{/products(catalog=${isCatalogView})}" class="btn btn-ghost">Reset</a>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="card empty-state">
            <div class="emoji">📦</div>
            <p>
                <span th:if="${emptyCategoryMessage}" th:text="${emptyCategoryMessage}"></span>
                <span th:if="${!emptyCategoryMessage and isCatalogView}">Katalog kosong.</span>
                <span th:if="${!emptyCategoryMessage and !isCatalogView and isSearchOrFilter}">Tidak ada hasil.</span>
                <span th:if="${!emptyCategoryMessage and !isCatalogView and !isSearchOrFilter}">Belum ada produk.</span>
            </p>
            <a th:if="${!emptyCategoryMessage and !isCatalogView and !isSearchOrFilter}" th:href="@{/products/new}" class="btn btn-primary" style="margin-top:1rem;">Tambah produk</a>
        </div>

        <div th:unless="${#lists.isEmpty(products)}" class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nama</th>
                    <th>Kategori</th>
                    <th>Harga</th>
                    <th>Stok</th>
                    <th>Status</th>
                    <th th:if="${isMyProductView}">Aksi</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p, iter : ${products}">
                    <td th:text="${iter.index + 1 + productPage.number * productPage.size}">1</td>
                    <td><a class="link" th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}">—</a></td>
                    <td><span class="pill pill-cyan" th:text="${p.category != null ? p.category.name : '—'}">—</span></td>
                    <td th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')}">0</td>
                    <td th:text="${p.stock}">0</td>
                    <td>
                        <span class="pill" th:classappend="${p.active} ? ' pill-green' : ' pill-red'"
                              th:text="${p.active} ? 'Aktif' : 'Nonaktif'">—</span>
                    </td>
                    <td th:if="${isMyProductView}">
                        <a class="link" th:href="@{/products/{id}/edit(id=${p.id})}">Edit</a>
                        ·
                        <form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" style="display:inline"
                              onsubmit="return confirm('Hapus produk ini?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-danger-text">Hapus</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${productPage.totalPages > 1}">
            <a th:if="${productPage.hasPrevious()}"
               th:href="@{/products(page=${productPage.number - 1}, keyword=${keyword}, categoryId=${selectedCategory?.id}, catalog=${isCatalogView})}">«</a>
            <th:block th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}">
                <a th:href="@{/products(page=${i}, keyword=${keyword}, categoryId=${selectedCategory?.id}, catalog=${isCatalogView})}"
                   th:text="${i + 1}"
                   th:classappend="${i == productPage.number} ? ' current'"></a>
            </th:block>
            <a th:if="${productPage.hasNext()}"
               th:href="@{/products(page=${productPage.number + 1}, keyword=${keyword}, categoryId=${selectedCategory?.id}, catalog=${isCatalogView})}">»</a>
        </div>
    </div>
</div>
</body>
</html>
