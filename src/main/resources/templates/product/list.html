<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Daftar Produk</h2>
            <a th:href="@{/products/new}" class="inline-flex items-center px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Tambah Produk Baru
            </a>
        </div>

        <!-- Search & Filter -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <form method="get" action="#" th:action="@{/products}" class="space-y-4">
                <input type="hidden" name="size" th:value="${pageSize}">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                    <!-- Search -->
                    <div class="lg:col-span-2">
                        <label for="search" class="block text-sm font-medium text-gray-700 mb-2">Cari Produk</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                </svg>
                            </div>
                            <input type="text" id="search" name="search" 
                                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none"
                                   placeholder="Cari berdasarkan nama..."
                                   th:value="${search}">
                        </div>
                    </div>

                    <!-- Min Price -->
                    <div>
                        <label for="minPrice" class="block text-sm font-medium text-gray-700 mb-2">Harga Min (Rp)</label>
                        <input type="number" id="minPrice" name="minPrice" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none"
                               placeholder="0"
                               th:value="${minPrice}">
                    </div>

                    <!-- Max Price -->
                    <div>
                        <label for="maxPrice" class="block text-sm font-medium text-gray-700 mb-2">Harga Max (Rp)</label>
                        <input type="number" id="maxPrice" name="maxPrice" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none"
                               placeholder="MAX"
                               th:value="${maxPrice}">
                    </div>

                    <!-- Stock Range -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label for="minStock" class="block text-sm font-medium text-gray-700 mb-2">Stok Min</label>
                            <input type="number" id="minStock" name="minStock" 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none"
                                   placeholder="0"
                                   th:value="${minStock}">
                        </div>
                        <div>
                            <label for="maxStock" class="block text-sm font-medium text-gray-700 mb-2">Stok Max</label>
                            <input type="number" id="maxStock" name="maxStock" 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none"
                                   placeholder="MAX"
                                   th:value="${maxStock}">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
                        </svg>
                        Filter
                    </button>
                    <a th:href="@{/products(size=${pageSize})}" class="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium rounded-lg transition-colors">
                        Reset
                    </a>
                </div>
            </form>
        </div>

        <div th:if="${successMessage}" class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 flex items-center" role="alert">
            <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 flex items-center" role="alert">
            <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span th:text="${errorMessage}"></span>
        </div>

        <p class="text-gray-500 mb-4">Total produk: <strong th:text="${productPage.totalElements}">0</strong></p>

        <div th:if="${productPage.hasContent()}">
            <div class="bg-white shadow overflow-hidden border-b border-gray-200 rounded-lg">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-800 text-white">
                        <tr>
                            <th class="px-6 py-3 text-left text-sm font-semibold">No</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Nama</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Harga</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Stok</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="product, iterStat : ${productPage.content}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${productPage.number * productPage.size + iterStat.count}">1</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${product.name}">Nama Produk</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${'Rp ' + #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')}">Rp 0</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${product.stock}">0</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                                <a th:href="@{/products/{id}(id=${product.id})}" class="inline-flex items-center px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium rounded transition-colors">Detail</a>
                                <a th:href="@{/products/{id}/edit(id=${product.id})}" class="inline-flex items-center px-3 py-1 bg-yellow-500 hover:bg-yellow-600 text-white text-sm font-medium rounded transition-colors">Edit</a>
                                <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" style="display:inline;" onsubmit="return confirm('Apakah Anda yakin ingin menghapus produk ini?');">
                                    <button type="submit" class="inline-flex items-center px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-sm font-medium rounded transition-colors">Hapus</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${!productPage.hasContent()}" class="text-center py-12 bg-white rounded-lg shadow">
            <p class="text-gray-500 text-lg mb-4" th:if="${minPrice != null or maxPrice != null or minStock != null or maxStock != null or (search != null and !#strings.isEmpty(search))}">Tidak ada produk yang cocok dengan filter Anda.</p>
            <p class="text-gray-500 text-lg mb-4" th:unless="${minPrice != null or maxPrice != null or minStock != null or maxStock != null or (search != null and !#strings.isEmpty(search))}">Belum ada produk.</p>
            <a th:href="@{/products/new}" class="inline-flex items-center px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition-colors shadow-sm">
                Tambah Produk Pertama
            </a>
        </div>

        <!-- Pagination -->
        <div th:if="${productPage.totalPages > 1}" class="mt-6 flex flex-col items-center gap-4">
            <nav class="inline-flex flex-wrap justify-center rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                <a th:href="@{/products(page=0, size=${pageSize}, search=${search}, minPrice=${minPrice}, maxPrice=${maxPrice}, minStock=${minStock}, maxStock=${maxStock})}"
                   class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"
                   th:classappend="${productPage.first} ? ' opacity-50 pointer-events-none' : ''"
                   aria-label="Halaman pertama">
                    <span class="sr-only">First</span>
                    <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path fill-rule="evenodd" d="M15.707 15.707a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 010 1.414zm-6 0a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 011.414 1.414L5.414 10l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
                    </svg>
                </a>
                <a th:href="@{/products(page=${productPage.number - 1}, size=${pageSize}, search=${search}, minPrice=${minPrice}, maxPrice=${maxPrice}, minStock=${minStock}, maxStock=${maxStock})}"
                   class="relative inline-flex items-center px-2 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"
                   th:classappend="${productPage.first} ? ' opacity-50 pointer-events-none' : ''">
                    <span class="sr-only">Previous</span>
                    <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
                    </svg>
                </a>

                <span th:each="i : ${#numbers.sequence(pageWindowStart, pageWindowEnd)}">
                    <a th:href="@{/products(page=${i}, size=${pageSize}, search=${search}, minPrice=${minPrice}, maxPrice=${maxPrice}, minStock=${minStock}, maxStock=${maxStock})}"
                       class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium"
                       th:class="${i == productPage.number} ? 'z-10 bg-blue-50 border-blue-500 text-blue-600' : 'text-gray-500 hover:bg-gray-50'">
                        <span th:text="${i + 1}">1</span>
                    </a>
                </span>

                <a th:href="@{/products(page=${productPage.number + 1}, size=${pageSize}, search=${search}, minPrice=${minPrice}, maxPrice=${maxPrice}, minStock=${minStock}, maxStock=${maxStock})}"
                   class="relative inline-flex items-center px-2 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"
                   th:classappend="${productPage.last} ? ' opacity-50 pointer-events-none' : ''">
                    <span class="sr-only">Next</span>
                    <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                    </svg>
                </a>
                <a th:href="@{/products(page=${productPage.totalPages - 1}, size=${pageSize}, search=${search}, minPrice=${minPrice}, maxPrice=${maxPrice}, minStock=${minStock}, maxStock=${maxStock})}"
                   class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"
                   th:classappend="${productPage.last} ? ' opacity-50 pointer-events-none' : ''"
                   aria-label="Halaman terakhir">
                    <span class="sr-only">Last</span>
                    <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path fill-rule="evenodd" d="M10.293 15.707a1 1 0 010-1.414L14.586 10l-4.293-4.293a1 1 0 111.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                        <path fill-rule="evenodd" d="M4.293 15.707a1 1 0 010-1.414L8.586 10 4.293 5.707a1 1 0 011.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                    </svg>
                </a>
            </nav>
        </div>

        <!-- Page Info -->
        <div class="mt-4 text-center text-sm text-gray-500" th:if="${productPage.totalElements > 0}">
            <span>Halaman <strong th:text="${productPage.number + 1}">1</strong> dari <strong th:text="${productPage.totalPages}">1</strong></span>
            <span class="mx-2">|</span>
            <span>Menampilkan <strong th:text="${productPage.number * productPage.size + 1}">1</strong>–<strong th:text="${productPage.number * productPage.size + productPage.numberOfElements}">10</strong> dari <strong th:text="${productPage.totalElements}">0</strong></span>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
