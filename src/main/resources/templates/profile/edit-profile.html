<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="main-area">
        <a th:href="@{/profile}" class="back-link">← Profil</a>
        <div class="form-card form-card-lg">
            <div class="form-card-header">
                <h1>Edit profil</h1>
            </div>
            <div class="form-card-body">
                <div th:if="${errorMessage}" class="flash flash-error" th:text="${errorMessage}"></div>
                <div th:if="${successMessage}" class="flash flash-success" th:text="${successMessage}"></div>

                <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data" class="form-grid">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="id" th:value="${user.id}"/>

                    <div class="profile-upload-zone">
                        <label class="form-label">Foto profil</label>
                        <div style="display:flex;flex-wrap:wrap;gap:1.25rem;align-items:flex-start;">
                            <div th:if="${user.profileImageUrl != null and !user.profileImageUrl.isEmpty()}">
                                <p class="form-label" style="margin-bottom:0.35rem;">Saat ini</p>
                                <img th:src="${user.profileImageUrl}" alt="Profil" class="avatar" style="width:72px;height:72px;">
                            </div>
                            <div style="flex:1;min-width:200px;">
                                <input type="file" id="profileImage" name="profileImage" accept="image/*"
                                       class="file-input"
                                       onchange="previewImage(this, 'imagePreview')">
                                <p style="margin:0.5rem 0 0;font-size:0.8rem;color:var(--text-muted);">
                                    Maks. 2MB. Kosongkan untuk mempertahankan foto sekarang.
                                </p>
                            </div>
                            <div>
                                <p class="form-label" style="margin-bottom:0.35rem;">Pratinjau unggahan</p>
                                <img id="imagePreview" class="avatar hidden" style="width:72px;height:72px;" alt="Pratinjau">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="form-label" for="fullName">Nama lengkap</label>
                        <input class="input" style="max-width:none;width:100%;" type="text" id="fullName" name="fullName" th:value="${user.fullName}" required>
                    </div>

                    <div>
                        <label class="form-label" for="email">Email</label>
                        <input class="input" style="max-width:none;width:100%;" type="email" id="email" name="email" th:value="${user.email}">
                    </div>

                    <div>
                        <label class="form-label" for="phoneNumber">Telepon</label>
                        <input class="input" style="max-width:none;width:100%;" type="tel" id="phoneNumber" name="phoneNumber" th:value="${user.phoneNumber}" placeholder="+62…">
                    </div>

                    <div>
                        <label class="form-label" for="address">Alamat</label>
                        <textarea class="input" style="max-width:none;width:100%;min-height:80px;" id="address" name="address" rows="3" th:text="${user.address}" placeholder="Alamat"></textarea>
                    </div>

                    <div>
                        <label class="form-label" for="bio">Bio</label>
                        <textarea class="input" style="max-width:none;width:100%;min-height:100px;" id="bio" name="bio" rows="4" th:text="${user.bio}" placeholder="Ceritakan sedikit tentang Anda"></textarea>
                    </div>

                    <div class="row-actions" style="margin:0;">
                        <button type="submit" class="btn btn-primary">Simpan</button>
                        <a th:href="@{/profile}" class="btn btn-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    function previewImage(input, previewId) {
        const preview = document.getElementById(previewId);
        if (!preview || !input.files || !input.files[0]) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            preview.src = e.target.result;
            preview.classList.remove('hidden');
        };
        reader.readAsDataURL(input.files[0]);
    }
</script>
</body>
</html>
