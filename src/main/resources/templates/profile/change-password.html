<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="main-area">
        <a th:href="@{/profile}" class="back-link">← Profil</a>
        <div class="form-card">
            <div class="form-card-header">
                <h1>Ubah sandi</h1>
            </div>
            <div class="form-card-body">
                <div th:if="${errorMessage}" class="flash flash-error" th:text="${errorMessage}"></div>
                <div th:if="${successMessage}" class="flash flash-success" th:text="${successMessage}"></div>

                <form th:action="@{/profile/change-password}" method="post" class="form-grid">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div>
                        <label class="form-label" for="oldPassword">Sandi lama</label>
                        <input class="input" style="max-width:none;width:100%;" type="password" id="oldPassword" name="oldPassword" required autocomplete="current-password" placeholder="••••••••">
                    </div>

                    <div>
                        <label class="form-label" for="newPassword">Sandi baru</label>
                        <input class="input" style="max-width:none;width:100%;" type="password" id="newPassword" name="newPassword" required minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter">
                    </div>

                    <div>
                        <label class="form-label" for="confirmNewPassword">Konfirmasi sandi baru</label>
                        <input class="input" style="max-width:none;width:100%;" type="password" id="confirmNewPassword" name="confirmNewPassword" required autocomplete="new-password" placeholder="Ulangi sandi baru">
                    </div>

                    <div class="row-actions" style="margin:0;">
                        <button type="submit" class="btn btn-primary">Ubah sandi</button>
                        <a th:href="@{/profile}" class="btn btn-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
