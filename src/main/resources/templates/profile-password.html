<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gradient-to-br from-slate-50 to-violet-50 min-h-screen">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-10 max-w-md">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Ganti password</h1>
            <p class="text-gray-600 mt-1">Masukkan password saat ini, lalu password baru Anda.</p>
        </div>

        <div th:if="${errorMessage}" class="mb-6 p-4 bg-rose-50 border-l-4 border-rose-500 text-rose-800 rounded-r-lg text-sm" role="alert" th:text="${errorMessage}">
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
            <form th:action="@{/profile/password}" method="post" class="space-y-5">
                <div>
                    <label for="currentPassword" class="block text-sm font-semibold text-gray-700 mb-2">Password saat ini</label>
                    <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-violet-500 focus:border-violet-500 focus:outline-none">
                </div>
                <div>
                    <label for="newPassword" class="block text-sm font-semibold text-gray-700 mb-2">Password baru</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6" autocomplete="new-password"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-violet-500 focus:border-violet-500 focus:outline-none">
                    <p class="text-xs text-gray-500 mt-1.5">Minimal 6 karakter.</p>
                </div>
                <div>
                    <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-2">Konfirmasi password baru</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-violet-500 focus:border-violet-500 focus:outline-none">
                </div>

                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                    <button type="submit" class="flex-1 px-6 py-3 rounded-xl bg-violet-600 text-white font-semibold hover:bg-violet-700 transition-colors">
                        Simpan password baru
                    </button>
                    <a th:href="@{/profile}" class="flex-1 text-center px-6 py-3 rounded-xl border border-gray-300 text-gray-700 font-semibold hover:bg-gray-50 transition-colors inline-flex items-center justify-center">
                        Batal
                    </a>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
