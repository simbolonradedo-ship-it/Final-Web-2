<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Aurora Stock</title>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-card">
    <div class="auth-logo">◆</div>
    <h1 class="auth-title">Aurora Stock</h1>
    <p class="auth-sub">Masuk untuk mengelola inventori</p>

    <div th:if="${successMessage}" class="flash flash-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="flash flash-error" th:text="${errorMessage}"></div>

    <form th:action="@{/auth/login}" method="post" class="form-grid">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label class="form-label" for="username">Username</label>
            <input class="input" style="max-width:none;width:100%;" id="username" name="username" required autocomplete="username">
        </div>
        <div>
            <label class="form-label" for="password">Password</label>
            <input class="input" style="max-width:none;width:100%;" type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">Masuk</button>
    </form>
    <p style="text-align:center;margin-top:1.25rem;font-size:0.9rem;color:var(--text-muted);">
        Belum punya akun?
        <a th:href="@{/auth/register}" style="color:var(--accent);font-weight:600;">Daftar</a>
    </p>
</div>
</body>
</html>
