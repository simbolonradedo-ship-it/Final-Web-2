<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Final Web'">Final Web</title>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<aside th:fragment="sidebar" class="sidebar">
    <div class="sidebar-brand">Final Web</div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="sidebar-link" th:classappend="${servletPath == '/dashboard'} ? ' active'">Dashboard</a>
        <a th:href="@{/products}" class="sidebar-link" th:classappend="${servletPath == '/products' and param.catalog == null} ? ' active'">Produk saya</a>
        <a th:href="@{/products(catalog=true)}" class="sidebar-link" th:classappend="${servletPath == '/products' and param.catalog != null and param.catalog[0] == 'true'} ? ' active'">Katalog admin</a>
        <a th:href="@{/categories}" class="sidebar-link" th:classappend="${#strings.startsWith(servletPath, '/categories')} ? ' active'">Kategori</a>
        <a th:href="@{/profile}" class="sidebar-link" th:classappend="${#strings.startsWith(servletPath, '/profile')} ? ' active'">Profil</a>
        <a th:href="@{/swagger-ui.html}" target="_blank" rel="noopener noreferrer" class="sidebar-link">API (Swagger)</a>
    </nav>
    <div class="sidebar-foot">
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="sidebar-link" style="width:100%;text-align:left;">Keluar</button>
        </form>
    </div>
</aside>
</html>
