<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar — Aurora Stock</title>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-card" style="max-width:480px;">
    <div class="auth-logo">+</div>
    <h1 class="auth-title">Buat akun</h1>
    <p class="auth-sub">Isi data di bawah untuk mulai</p>

    <div th:if="${errorMessage}" class="flash flash-error" th:text="${errorMessage}"></div>

    <form th:action="@{/auth/register}" method="post" class="form-grid">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label class="form-label" for="username">Username</label>
            <input class="input" style="max-width:none;width:100%;" id="username" name="username" required>
        </div>
        <div>
            <label class="form-label" for="fullName">Nama lengkap</label>
            <input class="input" style="max-width:none;width:100%;" id="fullName" name="fullName" required>
        </div>
        <div>
            <label class="form-label" for="email">Email (opsional)</label>
            <input class="input" style="max-width:none;width:100%;" type="email" id="email" name="email">
        </div>
        <div>
            <label class="form-label" for="password">Password</label>
            <input class="input" style="max-width:none;width:100%;" type="password" id="password" name="password" required minlength="6">
        </div>
        <div>
            <label class="form-label" for="confirmPassword">Konfirmasi password</label>
            <input class="input" style="max-width:none;width:100%;" type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Daftar</button>
    </form>
    <p style="text-align:center;margin-top:1.25rem;font-size:0.9rem;color:var(--text-muted);">
        Sudah terdaftar?
        <a th:href="@{/auth/login}" style="color:var(--accent);font-weight:600;">Masuk</a>
    </p>
</div>
</body>
</html>
