<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="main-area">
        <a th:href="@{/categories}" class="back-link">← Kategori</a>
        <div class="form-card">
            <div class="form-card-header">
                <h1 th:text="${category.id != null} ? 'Edit kategori' : 'Kategori baru'">Form</h1>
            </div>
            <div class="form-card-body">
                <form th:action="@{/categories/save}" th:object="${category}" method="post" class="form-grid">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div>
                        <label class="form-label" for="name">Nama</label>
                        <input class="input" style="max-width:none;width:100%;" id="name" th:field="*{name}" required>
                    </div>
                    <div>
                        <label class="form-label" for="description">Deskripsi</label>
                        <textarea class="input" style="max-width:none;width:100%;min-height:100px;" id="description" th:field="*{description}" rows="4"></textarea>
                    </div>
                    <div class="row-actions" style="margin:0;">
                        <button type="submit" class="btn btn-primary">Simpan</button>
                        <a th:href="@{/categories}" class="btn btn-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
