<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-800" th:text="${category.id != null} ? 'Edit Kategori' : 'Tambah Kategori Baru'">Form Kategori</h2>
            <p class="text-gray-500 mt-2" th:text="${category.id != null} ? 'Perbarui informasi kategori di bawah ini' : 'Isi form berikut untuk menambahkan kategori baru'"></p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-8">
            <form th:action="@{/categories/save}" th:object="${category}" method="post" class="space-y-6">
                <input type="hidden" th:field="*{id}">

                <div>
                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Nama Kategori</label>
                    <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all bg-gray-50 focus:bg-white" id="name" th:field="*{name}" placeholder="Masukkan nama kategori" required>
                </div>

                <div>
                    <label for="description" class="block text-sm font-semibold text-gray-700 mb-2">Deskripsi (Opsional)</label>
                    <textarea class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all resize-none" id="description" th:field="*{description}" rows="4" placeholder="Masukkan deskripsi kategori"></textarea>
                </div>

                <div class="flex justify-end gap-4 pt-4">
                    <a th:href="@{/categories}" class="inline-flex items-center px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-xl transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                        Batal
                    </a>
                    <button type="submit" class="inline-flex items-center px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Simpan Kategori
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
