<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gradient-to-br from-slate-50 via-emerald-50 to-teal-50">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-12 max-w-2xl">
        <div class="mb-8 animate-fade-in">
            <h2 class="text-3xl font-black text-gray-800" th:text="${category.id != null} ? 'Edit Kategori' : 'Tambah Kategori Baru'">Form Kategori</h2>
            <p class="text-gray-600 mt-2" th:text="${category.id != null} ? 'Perbarui informasi kategori di bawah ini' : 'Isi form berikut untuk menambahkan kategori baru'"></p>
        </div>

        <div class="bg-white/90 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/20 animate-slide-up">
            <form th:action="${category.id != null ? @{/categories/{id}(id=${category.id})} : @{/categories}}" th:object="${category}" method="post" class="space-y-6">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="_method" th:value="${category.id != null ? 'PUT' : 'POST'}" th:if="${category.id != null}"/>

                
                <div class="form-group">
                    <label for="name" class="form-label">Nama Kategori</label>
                    <input type="text" class="form-control form-control-lg" id="name" th:field="*{name}" 
                           placeholder="Masukkan nama kategori" required
                           th:classappend="${#fields.hasErrors('name')} ? 'form-error' : ''">
                    <div th:if="${#fields.hasErrors('name')}" class="mt-1 text-sm text-red-600" th:errors="*{name}"></div>
                </div>

                
                <div class="form-group">
                    <label for="description" class="form-label">Deskripsi (Opsional)</label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="4" 
                              placeholder="Masukkan deskripsi kategori"></textarea>
                </div>

                
                <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t border-gray-200">
                    <a th:href="@{/categories}" class="flex-1 btn btn-outline btn-lg">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                        Batal
                    </a>
                    <button type="submit" class="flex-1 btn btn-success btn-lg bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Simpan Kategori
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
