<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Daftar Kategori</h2>
            <a th:href="@{/categories/new}" class="inline-flex items-center px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Tambah Kategori
            </a>
        </div>

        
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <form method="get" action="#" th:action="@{/categories}" class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label for="search" class="block text-sm font-medium text-gray-700 mb-2">Cari Kategori</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </div>
                        <input type="text" id="search" name="search" 
                               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none"
                               placeholder="Cari berdasarkan nama kategori..."
                               th:value="${search}">
                    </div>
                </div>
                <div class="flex items-end gap-3">
                    <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">
                        <svg class="w-4 h-4 mr-2 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        Cari
                    </button>
                    <a th:href="@{/categories}" class="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium rounded-lg transition-colors">
                        Reset
                    </a>
                </div>
            </form>
        </div>

        <div class="mb-6 p-4 bg-emerald-50/50 border-l-4 border-emerald-500 rounded-r-lg flex items-start fade-in" th:if="${successMessage}" role="alert">
            <svg class="w-5 h-5 text-emerald-500 mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="text-emerald-700 text-sm font-medium" th:text="${successMessage}"></span>
        </div>
        <div class="mb-6 p-4 bg-red-50/50 border-l-4 border-red-500 rounded-r-lg flex items-start fade-in" th:if="${errorMessage}" role="alert">
            <svg class="w-5 h-5 text-red-500 mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="text-red-700 text-sm font-medium" th:text="${errorMessage}"></span>
        </div>

        <p class="text-gray-500 mb-4">Total kategori: <strong th:text="${#lists.size(categories)}">0</strong></p>

        <div class="table-container rounded-xl overflow-hidden shadow-lg" th:if="${!#lists.isEmpty(categories)}">
            <table class="table">
                <thead>
                    <tr>
                        <th class="px-6 py-4 text-left text-sm font-semibold uppercase tracking-wider">No</th>
                        <th class="px-6 py-4 text-left text-sm font-semibold uppercase tracking-wider">Nama Kategori</th>
                        <th class="px-6 py-4 text-left text-sm font-semibold uppercase tracking-wider">Deskripsi</th>
                        <th class="px-6 py-4 text-left text-sm font-semibold uppercase tracking-wider">Aksi</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:each="category, iterStat : ${categories}" class="hover:bg-blue-50/50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${iterStat.index + 1 + (currentPage * 10)}">1</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-gray-900" th:text="${category.name}">Nama Kategori</td>
                        <td class="px-6 py-4 text-sm text-gray-600 max-w-xs truncate" th:text="${category.description != null ? category.description : '-'}">Deskripsi</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                            <a th:href="@{/categories/{id}(id=${category.id})}" class="inline-flex items-center px-3 py-1.5 bg-blue-100 hover:bg-blue-200 text-blue-700 text-xs font-semibold rounded-lg transition-colors">Detail</a>
                            <a th:href="@{/categories/{id}/edit(id=${category.id})}" class="inline-flex items-center px-3 py-1.5 bg-yellow-100 hover:bg-yellow-200 text-yellow-700 text-xs font-semibold rounded-lg transition-colors">Edit</a>
                            <form th:action="@{/categories/{id}(id=${category.id})}" method="post" style="display:inline;" onsubmit="return confirm('Apakah Anda yakin ingin menghapus kategori ini?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="_method" value="delete"/>
                                <button type="submit" class="inline-flex items-center px-3 py-1.5 bg-red-100 hover:bg-red-200 text-red-700 text-xs font-semibold rounded-lg transition-colors">Hapus</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        </div>

        <div th:if="${#lists.isEmpty(categories)}" class="text-center py-12 bg-white rounded-lg shadow">
            <p class="text-gray-500 text-lg mb-4" th:if="${search}">Tidak ada kategori yang ditemukan untuk "<span th:text="${search}"></span>"</p>
            <p class="text-gray-500 text-lg mb-4" th:unless="${search}">Belum ada kategori.</p>
            <a th:href="@{/categories/new}" class="inline-flex items-center px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg transition-colors shadow-sm">
                Tambah Kategori Pertama
            </a>
        </div>

        
        <div th:if="${totalPages > 1}" class="mt-6 flex justify-center">
            <nav class="inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                
                <a th:href="@{/categories(page=${currentPage - 1}, search=${search})}"
                   class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"
                   th:class="${currentPage == 0} ? 'opacity-50 pointer-events-none' : ''">
                    <span class="sr-only">Previous</span>
                    <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
                    </svg>
                </a>

                
                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/categories(page=${i}, search=${search})}"
                       class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium"
                       th:class="${i == currentPage} ? 'z-10 bg-blue-50 border-blue-500 text-blue-600' : 'text-gray-500 hover:bg-gray-50'">
                        <span th:text="${i + 1}">1</span>
                    </a>
                </span>

                
                <a th:href="@{/categories(page=${currentPage + 1}, search=${search})}"
                   class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"
                   th:class="${currentPage >= totalPages - 1} ? 'opacity-50 pointer-events-none' : ''">
                    <span class="sr-only">Next</span>
                    <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                    </svg>
                </a>
            </nav>
        </div>

        
        <div class="mt-4 text-center text-sm text-gray-500">
            <span>Halaman <strong th:text="${currentPage + 1}">1</strong> dari <strong th:text="${totalPages}">1</strong></span>
            <span class="mx-2">|</span>
            <span>Total: <strong th:text="${totalItems}">0</strong> kategori</span>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
