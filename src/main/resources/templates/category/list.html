<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="main-area">
        <header class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem;">
            <div>
                <h1>Kategori</h1>
                <p>Kelola kategori produk Anda</p>
            </div>
            <a th:href="@{/categories/new}" class="btn btn-primary">+ Kategori</a>
        </header>

        <div th:if="${successMessage}" class="flash flash-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="flash flash-error" th:text="${errorMessage}"></div>

        <div th:if="${#lists.isEmpty(categories)}" class="card empty-state">
            <div class="emoji">📁</div>
            <p>Belum ada kategori.</p>
            <a th:href="@{/categories/new}" class="btn btn-primary" style="margin-top:1rem;">Tambah kategori</a>
        </div>

        <div th:unless="${#lists.isEmpty(categories)}" class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nama</th>
                    <th>Deskripsi</th>
                    <th>Dibuat</th>
                    <th>Aksi</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat, iter : ${categories}">
                    <td th:text="${iter.index + 1}">1</td>
                    <td th:text="${cat.name}">—</td>
                    <td th:text="${cat.description != null ? cat.description : '—'}">—</td>
                    <td th:text="${cat.createdAt}">—</td>
                    <td>
                        <a class="link" th:href="@{/categories/{id}/edit(id=${cat.id})}">Edit</a>
                        ·
                        <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post" style="display:inline"
                              onsubmit="return confirm('Hapus kategori ini?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-danger-text">Hapus</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
