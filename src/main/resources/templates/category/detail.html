<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-8 max-w-3xl">
        
        <div class="mb-6">
            <a th:href="@{/categories}" class="inline-flex items-center text-emerald-600 hover:text-emerald-800 font-medium transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Kembali ke Daftar
            </a>
        </div>

        
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            
            <div class="bg-gradient-to-r from-emerald-600 to-teal-600 px-8 py-6">
                <h2 class="text-2xl font-bold text-white" th:text="${category.name}">Nama Kategori</h2>
                <p class="text-emerald-100 mt-1">Detail informasi kategori</p>
            </div>

            
            <div class="p-8">
                <div class="space-y-6">
                    <div class="border-b border-gray-200 pb-4">
                        <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Nama Kategori</dt>
                        <dd class="mt-1 text-2xl font-bold text-gray-900" th:text="${category.name}">-</dd>
                    </div>
                    <div class="border-b border-gray-200 pb-4">
                        <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">Deskripsi</dt>
                        <dd class="mt-1 text-gray-700 whitespace-pre-wrap" th:text="${category.description != null ? category.description : '-'}">-</dd>
                    </div>
                    <div class="border-b border-gray-200 pb-4">
                        <dt class="text-sm font-medium text-gray-500 uppercase tracking-wide">ID Kategori</dt>
                        <dd class="mt-1 text-gray-900 font-mono text-sm" th:text="${category.id}">-</dd>
                    </div>
                </div>
            </div>

            
            <div class="bg-gray-50 px-8 py-6 border-t border-gray-200">
                <div class="flex flex-wrap gap-3">
                    <a th:href="@{/categories/{id}/edit(id=${category.id})}" class="inline-flex items-center px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded-xl transition-all shadow-sm hover:shadow-md">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        Edit Kategori
                    </a>
                    <a th:href="@{/categories}" class="inline-flex items-center px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-xl transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                        </svg>
                        Lihat Semua Kategori
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
