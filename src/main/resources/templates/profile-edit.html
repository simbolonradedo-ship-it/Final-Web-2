<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-12 max-w-3xl">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-800">Edit Profil</h2>
            <p class="text-gray-500 mt-2">Perbarui informasi profil Anda di bawah ini</p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-8">
            <form th:action="@{/profile/edit}" th:object="${user}" method="post" class="space-y-6">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="_method" value="put"/>

                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                    <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-gray-100 text-gray-500 cursor-not-allowed" id="username" th:field="*{username}" readonly>
                    <p class="text-xs text-gray-500 mt-1">Username tidak dapat diubah</p>
                </div>

                <div>
                    <label for="fullName" class="block text-sm font-semibold text-gray-700 mb-2">Nama Lengkap</label>
                    <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:outline-none transition-all" id="fullName" th:field="*{fullName}" placeholder="Masukkan nama lengkap" required>
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                    <input type="email" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:outline-none transition-all" id="email" th:field="*{email}" placeholder="contoh@email.com" required>
                </div>

                <div>
                    <label for="phoneNumber" class="block text-sm font-semibold text-gray-700 mb-2">Nomor Telepon</label>
                    <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:outline-none transition-all" id="phoneNumber" th:field="*{phoneNumber}" placeholder="08xxxxxxxxxx">
                </div>

                <div>
                    <label for="address" class="block text-sm font-semibold text-gray-700 mb-2">Alamat</label>
                    <textarea class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:outline-none transition-all resize-none" id="address" th:field="*{address}" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
                </div>

                <div>
                    <label for="bio" class="block text-sm font-semibold text-gray-700 mb-2">Bio</label>
                    <textarea class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:outline-none transition-all resize-none" id="bio" th:field="*{bio}" rows="4" placeholder="Ceritakan tentang diri Anda"></textarea>
                </div>

                <div>
                    <label for="profileImageUrl" class="block text-sm font-semibold text-gray-700 mb-2">URL Foto Profil</label>
                    <input type="url" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:outline-none transition-all" id="profileImageUrl" th:field="*{profileImageUrl}" placeholder="https://example.com/foto.jpg">
                    <p class="text-xs text-gray-500 mt-1">Masukkan URL gambar profil Anda</p>
                </div>

                <div class="flex justify-end gap-4 pt-4">
                    <a href="/profile" class="inline-flex items-center px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-xl transition-all">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                        Batal
                    </a>
                    <button type="submit" class="inline-flex items-center px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
