<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mx-auto px-4 py-10 max-w-2xl">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Edit profil</h1>
            <p class="text-gray-600 mt-1">Perbarui data Anda dan foto profil (opsional).</p>
        </div>

        <div th:if="${errorMessage}" class="mb-6 p-4 bg-rose-50 border-l-4 border-rose-500 text-rose-800 rounded-r-lg" role="alert" th:text="${errorMessage}">
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
            <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data" class="space-y-6">
                <div class="flex flex-col items-center gap-4 pb-6 border-b border-gray-100">
                    <div th:if="${user.profileImageUrl != null}" class="w-28 h-28 rounded-xl overflow-hidden border border-gray-200">
                        <img th:src="${user.profileImageUrl}" alt="Foto saat ini" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <label for="profileImage" class="block text-sm font-semibold text-gray-700 mb-2 text-center">Foto profil</label>
                        <input type="file" id="profileImage" name="profileImage" accept="image/jpeg,image/png,image/gif,image/webp"
                               class="block w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                        <p class="text-xs text-gray-500 mt-2 text-center">JPG, PNG, GIF, atau WebP. Maks. 2 MB.</p>
                    </div>
                </div>

                <div>
                    <label for="fullName" class="block text-sm font-semibold text-gray-700 mb-2">Nama lengkap</label>
                    <input type="text" id="fullName" name="fullName" th:value="${user.fullName}"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none"
                           placeholder="Nama Anda">
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" name="email" th:value="${user.email}"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none"
                           placeholder="email@contoh.com">
                </div>

                <div>
                    <label for="phoneNumber" class="block text-sm font-semibold text-gray-700 mb-2">Nomor telepon</label>
                    <input type="text" id="phoneNumber" name="phoneNumber" th:value="${user.phoneNumber}"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none"
                           placeholder="08…">
                </div>

                <div>
                    <label for="address" class="block text-sm font-semibold text-gray-700 mb-2">Alamat</label>
                    <textarea id="address" name="address" rows="3" th:text="${user.address} ?: ''"
                              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none resize-none"
                              placeholder="Alamat lengkap"></textarea>
                </div>

                <div>
                    <label for="bio" class="block text-sm font-semibold text-gray-700 mb-2">Bio</label>
                    <textarea id="bio" name="bio" rows="3" th:text="${user.bio} ?: ''"
                              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none resize-none"
                              placeholder="Ceritakan sedikit tentang Anda"></textarea>
                </div>

                <p class="text-sm text-gray-600 pt-2">
                    Ingin mengganti password?
                    <a th:href="@{/profile/password}" class="text-blue-600 font-medium hover:text-blue-800">Buka halaman ganti password</a>
                </p>

                <div class="flex flex-wrap gap-4 pt-4">
                    <button type="submit" class="px-6 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors">
                        Simpan perubahan
                    </button>
                    <a th:href="@{/profile}" class="px-6 py-3 rounded-xl border border-gray-300 text-gray-700 font-semibold hover:bg-gray-50 transition-colors inline-flex items-center">
                        Batal
                    </a>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
